<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
<title id="title">Human and AI participation across the evidence-generation ecosystem</title>
<desc id="description">Four connected stages from scientific questions to decisions and feedback. AI and human experts participate at each stage. Data provenance, testable assumptions, independent validation and accountable decisions span the process.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#67859C"/></marker></defs>
<rect width="1200" height="620" fill="#F7FAFC" rx="26"/>
<text x="600" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#15314E">An Evidence-Generation Ecosystem</text>
<text x="600" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#59758A">Human experts and AI can contribute across every stage</text>
