M363 300 H537" stroke="#D6E2EB" stroke-width="2"/><rect x="358" y="325" width="82" height="35" rx="17" fill="#DFEDF8" stroke="#DFEDF8" stroke-width="2"/><text x="399" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1A6B9C">AI</text><rect x="452" y="325" width="91" height="35" rx="17" fill="#E3F2EA" stroke="#E3F2EA" stroke-width="2"/><text x="498" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#23815F">Humans</text><path d="M567 280 H633" stroke="#67859C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="640" y="164" width="218" height="236" rx="18" fill="#FFFFFF" stroke="#CBDBE8" stroke-width="2"/><rect x="658" y="181" width="38" height="32" rx="12" fill="#173F63" stroke="#173F63" stroke-width="2"/><text x="677" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">03</text><text x="749" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#163C59">Interpretation &amp; Validation</text><text x="749" y="283" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#658098">What can we trust?</text><path d="M662 300 H836" stroke="#D6E2EB" stroke-width="2"/><rect x="657" y="325" width="82" height="35" rx="17" fill="#DFEDF8" stroke="#DFEDF8" stroke-width="2"/><text x="698" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1A6B9C">AI</text><rect x="751" y="325" width="91" height="35" rx="17" fill="#E3F2EA" stroke="#E3F2EA" stroke-width="2"/><text x="797" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#23815F">Humans</text><path d="M866 280 H932" stroke="#67859C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="939" y="164" width="218" height="236" rx="18" fill="#FFFFFF" stroke="#CBDBE8" stroke-width="2"/><rect x="957" y="181" width="38" height="32" rx="12" fill="#173F63" stroke="#173F63" stroke-width="2"/><text x="976" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">04</text><text x="1048" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#163C59">Decisions &amp; Feedback</text><text x="1048" y="283" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#658098">What does evidence justify?</text><path d="M961 300 H1135" stroke="#D6E2EB" stroke-width="2"/><rect x="956" y="325" width="82" height="35" rx="17" fill="#DFEDF8" stroke="#DFEDF8" stroke-width="2"/><text x="997" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1A6B9C">AI</text><rect x="1050" y="325" width="91" height="35" rx="17" fill="#E3F2EA" stroke="#E3F2EA" stroke-width="2"/><text x="1096" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#23815F">Humans</text><rect x="64" y="433" width="1072" height="87" rx="17" fill="#EAF1F7" stroke="#B8CBDA" stroke-width="2"/><text x="600" y="467" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#173F63">Scientific safeguards across the full process</text><text x="600" y="499" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#395E78">Traceable data  ·  Testable assumptions  ·  Independent validation  ·  Clear accountability</text><path d="M1049 404 V560 H151 V527" fill="none" stroke="#7692A8" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#arrow)"/><text x="600" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#55738A">Decisions generate new questions; evidence and assumptions must be revisited</text><text x="600" y="608" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#7D91A0">Evidence to Decision  |  Conceptual illustration, not a validated workflow</text></svg>