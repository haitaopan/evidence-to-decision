<circle cx="374" cy="197" r="16" fill="#173F63"/><text x="374" y="203" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#FFFFFF">2</text>
<text x="451" y="239" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#183650">证据生成与统计分析</text>
<text x="451" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#648097">Evidence &amp; Analysis</text>
<line x1="364" y1="289" x2="539" y2="289" stroke="#D8E2EA"/>
<rect x="363" y="313" width="82" height="34" rx="16" fill="#DCECF8"/><text x="404" y="336" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#1C6593">AI 参与</text>
<rect x="455" y="313" width="86" height="34" rx="16" fill="#E2F2E9"/><text x="498" y="336" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#23845F">人类参与</text>
<text x="451" y="381" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#4D6275">数据如何产生、如何分析？</text>
<path d="M565 283 H632" stroke="#65839C" stroke-width="2.5" marker-end="url(#arr)" fill="none"/>
<rect x="642" y="166" width="217" height="244" rx="18" fill="#FFFFFF" stroke="#CBD9E4" stroke-width="2"/>
<circle cx="673" cy="197" r="16" fill="#173F63"/><text x="673" y="203" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#FFFFFF">3</text>
