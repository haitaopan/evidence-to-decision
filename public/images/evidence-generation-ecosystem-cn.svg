<rect x="64" y="313" width="82" height="34" rx="16" fill="#DCECF8"/><text x="105" y="336" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#1C6593">AI 参与</text>
<rect x="156" y="313" width="86" height="34" rx="16" fill="#E2F2E9"/><text x="199" y="336" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#23845F">人类参与</text>
<text x="152" y="381" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#4D6275">研究什么、为谁研究？</text>
