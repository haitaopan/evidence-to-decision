<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
<title id="t">人类与 AI 共同参与的证据生成生态系统</title>
<desc id="d">科学问题与研究设计、证据生成与统计分析、证据解释与验证、临床决策与反馈。AI 和人类都可参与全过程，关键科学主张均应接受验证和责任治理。</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 z" fill="#65839C"/></marker></defs>
<rect width="1200" height="640" rx="30" fill="#F7FAFC"/>
<text x="600" y="64" font-family="Noto Sans CJK SC, sans-serif" text-anchor="middle" font-weight="700" font-size="33" fill="#15314E">人类与 AI 共同参与的证据生成生态系统</text>
<text x="600" y="103" font-family="Noto Sans CJK SC, sans-serif" text-anchor="middle" font-size="18" fill="#536B83">重点不是划分谁能做什么，而是让每一个重要的科学主张经得起检验</text>
<rect x="44" y="166" width="217" height="244" rx="18" fill="#FFFFFF" stroke="#CBD9E4" stroke-width="2"/>
